<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zero-Trust Authentication Gate | ADX Group</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg?v=2026.20" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v=2026.20" />
  <style>
    body {
      background: #030712;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      font-family: var(--font-sans);
    }

    #adx-quantum-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .auth-wrapper {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    /* Cyber Glassmorphism Authentication Box */
    .cyber-auth-box {
      width: 100%;
      max-width: 440px;
      background: rgba(9, 15, 30, 0.88);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.85), 0 0 45px rgba(56, 189, 248, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      position: relative;
      overflow: hidden;
    }

    .cyber-auth-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, #10b981, transparent);
      box-shadow: 0 0 14px #38bdf8;
    }

    .cyber-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .auth-header p {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .oauth-buttons {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 20px;
    }

    .btn-oauth {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-google {
      background: #ffffff;
      color: #0f172a;
    }

    .btn-google:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.2);
    }

    .btn-github {
      background: #111827;
      color: #f8fafc;
      border-color: rgba(56, 189, 248, 0.25);
    }

    .btn-github:hover {
      background: #1f2937;
      border-color: #38bdf8;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.2);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.74rem;
      font-family: var(--font-mono);
      margin: 18px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid var(--border-subtle);
    }

    .divider:not(:empty)::before {
      margin-right: 12px;
    }

    .divider:not(:empty)::after {
      margin-left: 12px;
    }

    .auth-tabs {
      display: flex;
      background: rgba(3, 7, 18, 0.8);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 18px;
      border: 1px solid var(--border-subtle);
    }

    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      background: transparent;
      border: none;
      transition: all 0.2s ease;
    }

    .auth-tab.active {
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent-cyan);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* High-Visibility Password Toggle Box */
    .pwd-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .pwd-wrap input {
      padding-right: 80px !important;
      width: 100%;
    }

    .pwd-toggle-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 6px;
      color: #38bdf8;
      cursor: pointer;
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: var(--font-mono);
      z-index: 10;
      user-select: none;
      transition: all 0.15s ease;
    }

    .pwd-toggle-btn:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #ffffff;
    }

    .oauth-modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .oauth-modal-card {
      width: 100%;
      max-width: 400px;
      background: #0b1329;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <!-- 60fps Interactive Quantum Constellation Background -->
  <canvas id="adx-quantum-canvas"></canvas>

  <div class="auth-wrapper">
    <div class="cyber-auth-box">

      <div class="auth-header">
        <a href="/" style="display: inline-block;">
          <img src="/static/logo.svg?v=2026.20" alt="ADX Group Logo" style="width: 54px; height: 54px; margin-bottom: 10px;" />
        </a>
        <div style="display: flex; justify-content: center;">
          <span class="cyber-badge">🛡️ ADX Zero-Trust Gateway</span>
        </div>
        <h1>Workspace Console Sign In</h1>
        <p>Access your 6-Gate 2026 CVE telemetry, AI Security Architect &amp; continuous domain monitoring.</p>
      </div>

      <!-- One-Click OAuth Providers (Google & GitHub) -->
      <div class="oauth-buttons">
        <button type="button" class="btn-oauth btn-google" onclick="openOAuthPrompt('Google')">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
            <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 11.2 0 12.3s.6 3.3 1.6 5.3l3.7-2.8z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5L1.6 16c1.9 3.9 5.8 7 10.4 7z"/>
          </svg>
          Continue with Google
        </button>

        <button type="button" class="btn-oauth btn-github" onclick="openOAuthPrompt('GitHub')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2.9-.3 1.9-.4 2.9-.4s2 .1 2.9.4c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.65 18.35.5 12 .5z"/>
          </svg>
          Continue with GitHub
        </button>
      </div>

      <div class="divider">OR CONTINUE WITH WORK EMAIL</div>

      <!-- Mode Switch Tabs -->
      <div class="auth-tabs">
        <button type="button" id="tab-signin" class="auth-tab active" onclick="switchTab('signin')">Sign In</button>
        <button type="button" id="tab-signup" class="auth-tab" onclick="switchTab('signup')">Create Account</button>
      </div>

      <div id="auth-error" style="color: #ef4444; font-size: 0.84rem; margin-bottom: 12px; text-align: center; font-weight: 600;"></div>

      <!-- Sign In Form -->
      <form id="signin-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="signin-email" class="form-control" placeholder="you@company.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="pwd-wrap">
            <input type="password" id="signin-password" class="form-control" placeholder="••••••••" required />
            <button type="button" class="pwd-toggle-btn" id="btn-toggle-signin" onclick="togglePwdVisibility('signin-password', this)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span>Show</span>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Sign In to Console</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signup-form" class="hidden">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="signup-name" class="form-control" placeholder="Alex Mercer" required />
        </div>
        <div class="form-group">
          <label>Company / Organization</label>
          <input type="text" id="signup-company" class="form-control" placeholder="Acme FinTech Ltd" />
        </div>
        <div class="form-group">
          <label>Work or Personal Email *</label>
          <input type="email" id="signup-email" class="form-control" placeholder="you@company.com" required />
        </div>
        <div class="form-group">
          <label>Create Password (min. 6 chars) *</label>
          <div class="pwd-wrap">
            <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required />
            <button type="button" class="pwd-toggle-btn" id="btn-toggle-signup" onclick="togglePwdVisibility('signup-password', this)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span>Show</span>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Create Free ADX Account</button>
      </form>

      <div style="text-align: center; margin-top: 22px;">
        <a href="/" style="color: var(--text-muted); font-size: 0.84rem; text-decoration: none;">&larr; Back to adxgroup.tech homepage</a>
      </div>
    </div>
  </div>

  <!-- Instant OAuth Identity Modal -->
  <div id="oauth-modal" class="oauth-modal hidden">
    <div class="oauth-modal-card">
      <h3 id="oauth-modal-title" style="margin-bottom: 6px; color: #ffffff;">Continue with Google</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">
        Confirm your account email to authenticate into your ADX Workspace:
      </p>
      <form id="oauth-form">
        <input type="hidden" id="oauth-provider" value="Google" />
        <div class="form-group">
          <label id="oauth-email-label">Google Email Address *</label>
          <input type="email" id="oauth-email" class="form-control" placeholder="you@gmail.com" required />
        </div>
        <div class="form-group">
          <label>Your Full Name</label>
          <input type="text" id="oauth-name" class="form-control" placeholder="Optional" />
        </div>
        <div class="form-group">
          <label>Company / Workspace</label>
          <input type="text" id="oauth-company" class="form-control" placeholder="Optional" />
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="button" class="btn btn-outline" style="flex: 1;" onclick="closeOAuthPrompt()">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex: 1;">Authenticate</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. Extraordinary 60fps Interactive Quantum Neural Constellation & Orbital Radar Background
    (function initQuantumOrbitalBackground() {
      const canvas = document.getElementById("adx-quantum-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      let w = (canvas.width = window.innerWidth);
      let h = (canvas.height = window.innerHeight);

      window.addEventListener("resize", () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const mouse = { x: w * 0.5, y: h * 0.4, active: false };
      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
      });

      const nodeCount = 42;
      const nodes = [];
      for (let i = 0; i < nodeCount; i++) {
        nodes.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          r: Math.random() * 1.8 + 1.0,
          color: i % 4 === 0 ? "#10b981" : "#38bdf8",
        });
      }

      let angle = 0;
      function drawFrame() {
        ctx.clearRect(0, 0, w, h);
        angle += 0.002;

        // Subtle Rotating Orbital Defense Radar
        const cx = w * 0.5;
        const cy = h * 0.5;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.strokeStyle = "rgba(56, 189, 248, 0.08)";
        ctx.lineWidth = 1.2;
        ctx.setLineDash([18, 14, 4, 14]);
        ctx.beginPath();
        ctx.arc(0, 0, Math.min(w, h) * 0.44, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // Neural Node Connections
        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          n.x += n.vx;
          n.y += n.vy;
          if (n.x < 0 || n.x > w) n.vx *= -1;
          if (n.y < 0 || n.y > h) n.vy *= -1;

          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fillStyle = n.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = n.color;
          ctx.fill();
          ctx.shadowBlur = 0;

          for (let j = i + 1; j < nodes.length; j++) {
            const m = nodes[j];
            const dist = Math.hypot(n.x - m.x, n.y - m.y);
            if (dist < 125) {
              ctx.strokeStyle = `rgba(56, 189, 248, ${0.18 * (1 - dist / 125)})`;
              ctx.lineWidth = 0.8;
              ctx.beginPath();
              ctx.moveTo(n.x, n.y);
              ctx.lineTo(m.x, m.y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(drawFrame);
      }
      drawFrame();
    })();

    // 2. High-Visibility Password Toggle
    function togglePwdVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (!input) return;
      const span = btn.querySelector("span");
      if (input.type === "password") {
        input.type = "text";
        if (span) span.textContent = "Hide";
        btn.style.color = "#10b981";
        btn.style.borderColor = "#10b981";
      } else {
        input.type = "password";
        if (span) span.textContent = "Show";
        btn.style.color = "#38bdf8";
        btn.style.borderColor = "rgba(56, 189, 248, 0.35)";
      }
    }

    // 3. Tab Switching
    function switchTab(mode) {
      const signinForm = document.getElementById("signin-form");
      const signupForm = document.getElementById("signup-form");
      const tabSignin = document.getElementById("tab-signin");
      const tabSignup = document.getElementById("tab-signup");
      document.getElementById("auth-error").textContent = "";

      if (mode === "signin") {
        signinForm.classList.remove("hidden");
        signupForm.classList.add("hidden");
        tabSignin.classList.add("active");
        tabSignup.classList.remove("active");
      } else {
        signinForm.classList.add("hidden");
        signupForm.classList.remove("hidden");
        tabSignin.classList.remove("active");
        tabSignup.classList.add("active");
      }
    }

    function openOAuthPrompt(provider) {
      document.getElementById("oauth-provider").value = provider;
      document.getElementById("oauth-modal-title").textContent = `Continue with ${provider}`;
      document.getElementById("oauth-email-label").textContent = `${provider} Email Address *`;
      document.getElementById("oauth-modal").classList.remove("hidden");
      document.getElementById("oauth-email").focus();
    }

    function closeOAuthPrompt() {
      document.getElementById("oauth-modal").classList.add("hidden");
    }

    const urlParams = new URLSearchParams(window.location.search);
    const pendingScan = urlParams.get("scan") || "";
    const isLogout = urlParams.get("logout") === "true";

    function getRedirectUrl(defaultUrl) {
      if (pendingScan) {
        return `/dashboard?scan=${encodeURIComponent(pendingScan)}`;
      }
      return defaultUrl || "/dashboard";
    }

    if (isLogout) {
      try {
        localStorage.removeItem("adx_session_token");
        localStorage.removeItem("adx_user");
      } catch (e) {}
    } else {
      // Automatic Session Restoration across refreshes & restarts
      window.addEventListener("DOMContentLoaded", async () => {
        try {
          const savedToken = localStorage.getItem("adx_session_token");
          if (savedToken) {
            const syncRes = await fetch("/api/auth/sync", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token: savedToken }),
            });
            const syncData = await syncRes.json();
            if (syncRes.ok && syncData.ok) {
              window.location.href = getRedirectUrl(syncData.redirect);
            }
          }
        } catch (e) {}
      });
    }

    if (pendingScan) {
      const subText = document.querySelector(".auth-header p");
      if (subText) {
        subText.innerHTML = `Sign in to unlock the live 6-Gate 2026 CVE Security Report for <strong style="color: var(--accent-cyan); font-family: var(--font-mono);">${pendingScan}</strong>`;
      }
    }

    document.getElementById("oauth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const provider = document.getElementById("oauth-provider").value;
      const email = document.getElementById("oauth-email").value.trim();
      const name = document.getElementById("oauth-name").value.trim();
      const company = document.getElementById("oauth-company").value.trim();

      const res = await fetch("/api/auth/oauth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ provider, email, name, company }),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        if (data.token) localStorage.setItem("adx_session_token", data.token);
        if (data.user) localStorage.setItem("adx_user", JSON.stringify(data.user));
        window.location.href = getRedirectUrl(data.redirect);
      } else {
        alert(data.detail || "Authentication failed.");
      }
    });

    document.getElementById("signin-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("signin-email").value.trim();
      const password = document.getElementById("signin-password").value;
      const errBox = document.getElementById("auth-error");
      errBox.textContent = "";

      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        if (data.token) localStorage.setItem("adx_session_token", data.token);
        if (data.user) localStorage.setItem("adx_user", JSON.stringify(data.user));
        window.location.href = getRedirectUrl(data.redirect);
      } else {
        errBox.textContent = data.detail || "Invalid email or password.";
      }
    });

    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("signup-name").value.trim();
      const company = document.getElementById("signup-company").value.trim();
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;
      const errBox = document.getElementById("auth-error");
      errBox.textContent = "";

      const res = await fetch("/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, company, email, password }),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        if (data.token) localStorage.setItem("adx_session_token", data.token);
        if (data.user) localStorage.setItem("adx_user", JSON.stringify(data.user));
        window.location.href = getRedirectUrl(data.redirect);
      } else {
        errBox.textContent = data.detail || "Could not create account.";
      }
    });
  </script>
</body>
</html>

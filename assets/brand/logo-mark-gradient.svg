<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Core Background -->
    <radialGradient id="adxVoid" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0d1b38" />
      <stop offset="55%" stop-color="#060b18" />
      <stop offset="100%" stop-color="#020409" />
    </radialGradient>

    <!-- Holographic Outer Shield Rim -->
    <linearGradient id="adxRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="75%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- 3D Left Wing Metallic Cyan-Cobalt -->
    <linearGradient id="wingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- 3D Right Wing Deep Cyber Shadow -->
    <linearGradient id="wingRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Hypersonic X-Blade Gradient -->
    <linearGradient id="xBlade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Outer Precision Octagonal-Hex Armor Base -->
  <polygon
    points="128,8 232,64 232,192 128,248 24,192 24,64"
    fill="url(#adxVoid)"
    stroke="url(#adxRim)"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Inner Faceted Shield Frame -->
  <polygon
    points="128,24 216,72 216,184 128,232 40,184 40,72"
    fill="none"
    stroke="#38bdf8"
    stroke-opacity="0.28"
    stroke-width="1.5"
    stroke-dasharray="10 6"
  />

  <!-- Rotating Orbital Telemetry Ring -->
  <circle
    cx="128"
    cy="128"
    r="86"
    fill="none"
    stroke="url(#adxRim)"
    stroke-width="1.5"
    stroke-opacity="0.4"
    stroke-dasharray="28 14 8 14"
  />

  <!-- 3D Faceted 'A' Apex Pillar (Left Lit Facet) -->
  <polygon
    points="128,44 62,196 98,196 128,116"
    fill="url(#wingLeft)"
  />

  <!-- 3D Faceted 'A' Apex Pillar (Right Shadowed Facet) -->
  <polygon
    points="128,44 128,116 158,196 194,196"
    fill="url(#wingRight)"
  />

  <!-- Interlocking 'X' Secondary Slash -->
  <polygon
    points="68,74 94,74 192,196 164,196"
    fill="#1d4ed8"
    opacity="0.88"
  />

  <!-- Hypersonic 'X' Primary Orbital Blade -->
  <path
    d="M 52 198 C 96 154, 144 108, 206 58 L 182 54 C 132 98, 90 142, 46 184 Z"
    fill="url(#xBlade)"
  />

  <!-- Central Defense Core Node -->
  <polygon points="128,114 142,128 128,142 114,128" fill="#ffffff" />
  <polygon points="128,119 137,128 128,137 119,128" fill="#38bdf8" />

  <!-- Corner Precision Accents -->
  <circle cx="128" cy="24" r="3.5" fill="#38bdf8" />
  <circle cx="128" cy="232" r="3.5" fill="#10b981" />
  <circle cx="40" cy="72" r="2.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="216" cy="72" r="2.5" fill="#38bdf8" opacity="0.7" />
</svg>